name: Lightweight editor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: npm install --prefix /tmp/tok-browser --no-package-lock playwright@1.58.2
      - run: /tmp/tok-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs && node tests/library-browser.cjs
        env:
          TOK_PLAYWRIGHT: /tmp/tok-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-browser-previews
          path: /tmp/typesetok-*.png
