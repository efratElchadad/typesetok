name: Retire Studio release
on:
  push:
    branches: [publish/studio-0.4.0]
permissions:
  contents: write
jobs:
  remove-release:
    if: github.repository == 'efratElchadad/typesetok'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the superseded Studio release and its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/efratElchadad/typesetok/releases/401576496
